
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAME | UX/UI Designer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');

    :root {
      --primary-color: #4a90e2;
      --bg-color: #f4f6f8;
      --text-color: #2e2e2e;
      --accent-color: #ff6b6b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(45deg, #f0f4ff, #ffffff);
      color: var(--text-color);
      line-height: 1.6;
      position: relative;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 10%;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      text-decoration: none;
      color: var(--text-color);
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover,
    nav a.active {
      color: var(--primary-color);
    }

    .hero {
      height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(to right, #f0f4ff, #ffffff);
      padding: 0 1rem;
      position: relative;
      overflow: hidden;
    }

    .hero-content {
      animation: fadeSlideIn 1.5s ease forwards;
      opacity: 0;
      transform: translateY(20px);
      z-index: 2;
    }

    @keyframes fadeSlideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-content h1 {
      font-size: 2.8rem;
      margin-bottom: 1rem;
    }

    .hero-content .highlight {
      color: var(--primary-color);
    }

    .hero-content p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #555;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background-color: var(--accent-color);
      color: white;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #ff4c4c;
    }

    #image-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .fade-image {
      position: absolute;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      width: 150px;
      height: auto;
    }

    .fade-in {
      opacity: 1;
    }

    footer {
      background: #2c3e50;
      padding: 3rem 1rem;
      text-align: center;
      color: #ecf0f1;
      margin-top: 4rem;
      border-top: 1px solid #1a252f;
    }

    .footer-links {
      margin-bottom: 1rem;
    }

    .footer-links a {
      margin: 0 1rem;
      text-decoration: none;
      color: #ecf0f1;
      font-weight: 500;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .footer-links a:hover {
      color: var(--accent-color);
      transform: translateY(-2px);
    }

    .footer-bottom {
      font-size: 0.9rem;
      color: #bdc3c7;
    }

    @media (max-width: 768px) {
      .hero-content h1 {
        font-size: 2rem;
      }

      nav ul {
        flex-direction: column;
        gap: 1rem;
      }

      .footer-links a {
        display: block;
        margin: 0.5rem 0;
      }
    }

    /* === About Me Section Styles === */
    .about-me-section {
      padding: 60px 20px;
      background: linear-gradient(to bottom right, #f0f4ff, #e6e1ff);
      font-family: 'Segoe UI', sans-serif;
      color: #333;
    }

    .about-me-container {
      display: flex;
      align-items: flex-start;
      gap: 40px;
      max-width: 1000px;
      margin: auto;
      flex-wrap: wrap;
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    .profile-photo img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid #8a2be2;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
    }

    .about-me-content {
      flex: 1;
      min-width: 260px;
    }

    .about-me-content h2 {
      font-size: 28px;
      color: #5e2ced;
      margin-bottom: 15px;
    }

    .action-circles {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }

    .circle {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      transition: transform 0.2s, box-shadow 0.3s;
      cursor: pointer;
    }

    .resume {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
    }

    .email {
      background: linear-gradient(135deg, #ff512f, #dd2476);
    }

    .third {
      background: linear-gradient(135deg, #f7971e, #ffd200);
    }

    .circle:hover {
      transform: scale(1.15);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .about-me-content p {
      font-size: 17px;
      line-height: 1.7;
      color: #444;
      margin-top: 10px;
      margin-bottom: 25px;
    }

    .about-footer {
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      color: #fff;
      padding: 16px 20px;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 6px 20px rgba(255, 65, 108, 0.3);
    }

    @media (max-width: 768px) {
      .about-me-container {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .action-circles {
        justify-content: center;
      }

      .about-footer {
        font-size: 15px;
      }
    }

    .pink-links-container {
      background-color: #ff1493;
      padding: 20px 0;
      text-align: center;
    }

    .pink-links-container a {
      color: white;
      text-decoration: none;
      margin: 0 25px;
      font-size: 18px;
      font-weight: bold;
      transition: color 0.3s, text-decoration 0.3s;
    }

    .pink-links-container a:hover {
      color: #ffeef8;
      text-decoration: underline;
    }
  </style>
</head>
